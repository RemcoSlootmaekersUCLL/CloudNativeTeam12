# File: .github/workflows/workflow.yml
name: Deploy Frontend to Azure Web App (publish profile)

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"

env:
  AZURE_WEBAPP_NAME: CNE-GROEP12-WEB-APP # Set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: "frontend" # Set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: "20.x" # Set this to the node version to use

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm install, build, and test
        run: |
          [ -f package-lock.json ] && rm package-lock.json
          npm ci
          npm run build --if-present
          npm run test --if-present
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      - name: "Deploy to Azure WebApp"
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
